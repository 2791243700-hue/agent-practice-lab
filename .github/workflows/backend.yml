name: Backend checks

on:
  push:
    branches: [main, feat/backend]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
      - run: uv sync --locked
      - run: uv run ruff check --config pyproject.toml src tests
      - run: uv run ruff format --check --config pyproject.toml src tests alembic
      - run: uv run pytest -q
